<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talksy-App | Chat your msg</title>
    <link
      rel="shortcut icon"
      href="Assets/favicon_icon.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <div class="sidebar">
        <h2>Chats</h2>

        <input type="text" placeholder="   Search chat..." class="search" />

        <div class="chat-list">
          <div class="chat">
            <img src="" alt="person" />
            <div>
              <h4>Name</h4>
              <p>message</p>
            </div>
          </div>

          <!-- <div class="chat">
            <img src="" />
            <div>
              <h4>name</h4>
              <p>message</p>
            </div>
          </div> -->
        </div>
      </div>
      

      <!-- Chat Section -->
      <div class="chat-area">
        <div class="chat-header">
          <img src="" alt="person" />
          <h3>Name</h3>
        </div>

        <div class="messages">
          <div class="msg other">message</div>

          <div class="msg me">your message..</div>
        </div>

        <div class="input-area">
          <input type="text" placeholder="Type message..." />
          <button>Send</button>
        </div>
      </div>
    </div>
  </body>
</html>
