<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talksy-App | Login</title>
    <link rel="shortcut icon" href="Assets/favicon_icon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Login Page</h1>
    <div>
        <form action="login" method="post" id="loginForm">
            <div class="form-header">
                <h3>Please Fill Your Details </h3>
            </div>
            <label for="username">Username :</label>
            <input type="text" id="username" name="username" required placeholder="Enter User name">

            <label for="Mobile">Mobile :</label>
            <input type="number" id="Mobile" name="Mobile" required placeholder="Enter Number">

            <label for="Password">Password :</label>
            <input type="password" id="Password" name="Password" required placeholder="Enter Password">

            <button type="submit" id="btn">Login</button>
        </form>
    </div>
</body>
</html>
